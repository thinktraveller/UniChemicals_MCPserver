[project]
name = "pubchempy-mcp-server"
version = "0.1.1"
description = "An MCP server for PubChem database using PubChemPy."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0",
    "pubchempy>=1.0.5",
    "pandas>=2.0.0"
]

[project.scripts]
pubchempy-mcp-server = "pubchem_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubchem_mcp_server"]

