[project]
name = "unichemicals-mcp-server"
version = "1.1.0"
description = "An MCP server for multi-database chemistry queries (PubChem + CAS Common Chemistry)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0",
    "pubchempy>=1.0.5",
    "pandas>=2.0.0",
    "requests>=2.31",
    "python-dotenv>=1.0"
]

[project.scripts]
unichemicals-mcp-server = "pubchem.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubchem", "src/cas"]

